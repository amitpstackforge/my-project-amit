<!-- Mobile dropdown -->
<div class="sm:hidden mb-4">
    <label for="tabs" class="sr-only">Select tab</label>


    <select id="tabs" (change)="selectTab($event)" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg 
           focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5">
        <option *ngFor="let tab of tabs" [selected]="tab === selectedTab">{{ tab }}</option>
    </select>

</div>

<!-- Desktop tabs -->
<ul class="flex justify-center items-center s   mt-6">
    <li *ngFor="let tab of tabs" class="focus-within:z-10">
        <button (click)="selectTab(tab)" [ngClass]="{
        'text-white bg-green-600 hover:bg-green-700 dark:bg-green-700 dark:hover:bg-green-800':
          tab === selectedTab,
        'text-gray-800 bg-[#F3FAF7] hover:bg-green-50 dark:bg-gray-800 dark:hover:bg-gray-700 dark:text-gray-300':
          tab !== selectedTab
      }" class="inline-block min-w-[150px] p-4 border border-gray-200 dark:border-gray-700 
             focus:ring-4 focus:ring-green-300 focus:outline-none text-center font-medium 
             rounded-lg transition-all duration-200">
            {{ tab }}
        </button>
    </li>
</ul>

<div class="flex items-center justify-between mt-4 mb-0">
    <p class="text-xl text-gray-900 dark:text-white">Tasks</p>

    <button type="button" class="flex items-center gap-2 text-white bg-green-700 hover:bg-green-800 focus:outline-none 
         focus:ring-4 focus:ring-green-300 font-medium rounded-full text-sm px-5 py-2.5 text-center 
         dark:bg-green-600 dark:hover:bg-green-700 dark:focus:ring-green-800" (click)="toggleModal()">

        <!-- ✅ Plus SVG icon -->
        <svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"
            xmlns="http://www.w3.org/2000/svg">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"></path>
        </svg>

        Add task

    </button>

</div>


<!-- Tab Content -->
<div class="p-4 mt-4 border rounded-lg bg-gray-50 dark:bg-gray-800 dark:text-white">

    <!-- ✅ Common filtered task list -->
    <ng-container *ngIf="filteredTasks.length > 0; else noTaskFound">
        <div *ngIf="selectedTab === 'Today'">
            <div *ngFor="let task of filteredTasks; let i = index" class="flex items-center justify-between w-full px-4 py-2 text-sm font-medium 
         border-b border-gray-200 rounded-t-lg hover:bg-gray-100 hover:text-blue-700 
         dark:border-gray-600 dark:hover:bg-gray-600 dark:hover:text-white 
         dark:focus:ring-gray-500 dark:focus:text-white">

                <!-- Left -->
                <div class="flex items-center gap-5">
                    <input type="checkbox" [(ngModel)]="task.completed" (change)="toggleComplete(task)"
                        class="w-4 h-4 text-blue-600 bg-gray-100 border-gray-300 rounded-sm focus:ring-blue-500" />
                    <p class="text-sm text-gray-700 dark:text-gray-200 font-medium"
                        [ngClass]="{'line-through text-gray-400': task.completed}">
                        {{ task.name }}
                    </p>
                </div>

                <!-- Date -->
                <div class="flex items-center gap-2 text-sm text-gray-700 dark:text-gray-200">
                    📅 {{ task.date }}
                </div>

                <!-- Actions -->
                <div class="flex gap-2">


                    <button (click)="onEditTask(i)" class="btn-icon">✏️</button>
                    <button (click)="onDeleteTask(i)" class="btn-icon">🗑️</button>
                </div>
            </div>
        </div>

        <!-- 🟡 Pending Tab -->
        <div *ngIf="selectedTab === 'Pending'">
            <div *ngFor="let task of filteredTasks; let i = index" class="flex items-center justify-between w-full px-4 py-2 text-sm font-medium 
                     border-b border-gray-200 hover:bg-gray-100 dark:border-gray-600">
                <div class="flex flex-col">
                    <p class="font-semibold text-yellow-700 dark:text-yellow-400">{{ task.name }}</p>
                    <p class="text-xs text-gray-500 dark:text-gray-400">{{ task.date }}</p>
                </div>
                <div class="flex gap-2">
                    <!-- ✅ Mark as Completed -->
                    <button (click)="toggleComplete(task)"
                        class="px-3 py-1 text-sm bg-green-600 text-white rounded-lg hover:bg-green-700">
                        ✅ Complete
                    </button>
                    <button (click)="onEditTask(i)" class="btn-icon">✏️</button>
                    <button (click)="onDeleteTask(i)" class="btn-icon">🗑️</button>
                </div>
            </div>
        </div>


        <!-- 🔴 Overdue Tab -->
        <div *ngIf="selectedTab === 'Overdue'">
            <div *ngFor="let task of filteredTasks; let i = index" class="flex items-center justify-between w-full px-4 py-2 text-sm font-medium 
                     border-b border-gray-200 hover:bg-gray-100 dark:border-gray-600">
                <div class="flex flex-col">
                    <p class="font-semibold text-red-700 dark:text-red-400">{{ task.name }}</p>
                    <p class="text-xs text-gray-500 dark:text-gray-400">{{ task.date }}</p>
                </div>
                <div class="flex gap-2">
                    <!-- ✅ Mark as Completed -->
                    <button (click)="toggleComplete(task)"
                        class="px-3 py-1 text-sm bg-green-600 text-white rounded-lg hover:bg-green-700">
                        ✅ Complete
                    </button>
                    <button (click)="onEditTask(i)" class="btn-icon">✏️</button>
                    <button (click)="onDeleteTask(i)" class="btn-icon">🗑️</button>
                </div>
            </div>
        </div>

        <!--  Completed Tab -->
        <div *ngIf="selectedTab === 'Completed'">
            <div *ngFor="let task of filteredTasks; let i = index" class="flex items-center justify-between w-full px-4 py-2 text-sm font-medium 
                                     border-b border-gray-200 hover:bg-gray-100 dark:border-gray-600">
                <div class="flex flex-col">
                    <p class="font-semibold text-red-700 dark:text-red-400">{{ task.name }}</p>
                    <p class="text-xs text-gray-500 dark:text-gray-400">{{ task.date }}</p>
                </div>
                <div class="flex gap-2">
                    <!-- ↩️ Undo button -->
                    <button (click)="toggleComplete(task)"
                        class="px-3 py-1 text-sm bg-yellow-500 text-white rounded-lg hover:bg-yellow-600 transition-all">
                        ↩️ Undo
                    </button>
                    <button (click)="onEditTask(i)" class="btn-icon">✏️</button>
                    <button (click)="onDeleteTask(i)" class="btn-icon">🗑️</button>
                </div>
            </div>
        </div>
        <!-- Pagination (optional, same as before) -->
        <nav aria-label="Page navigation example" class="mt-6">
            <ul class="inline-flex -space-x-px text-base h-10">
                <li><a href="#" class="page-btn">Previous</a></li>
                <li><a href="#" class="page-btn">1</a></li>
                <li><a href="#" class="page-btn">2</a></li>
                <li><a href="#" class="page-btn active">3</a></li>
                <li><a href="#" class="page-btn">Next</a></li>
            </ul>
        </nav>


    </ng-container>


    <!-- ✅ No task fallback -->
    <ng-template #noTaskFound>
        <p class="text-center text-gray-500 dark:text-gray-400 py-6">
            ⚠️ No {{ selectedTab }} tasks found.
        </p>
    </ng-template>


    <!-- ✅ Toast Notification -->
    <div *ngIf="showToast" class="fixed bottom-5 right-5 bg-green-600 text-white text-sm px-5 py-3 rounded-lg shadow-lg 
             animate-fade-in-out">
        {{ toastMessage }}
    </div>

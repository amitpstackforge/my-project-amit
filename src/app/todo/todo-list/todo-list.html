<div class="px-4 py-3 max-w-md mx-auto">
    <h2 class="text-lg font-semibold mb-3">আমার কাজগুলো</h2>

    <!-- Add new task -->
    <div class="flex gap-2 mb-4">
        <input [(ngModel)]="newTaskTitle" type="text" placeholder="Enter new task" id="newTaskTitle" name="newTaskTitle"
            class="border rounded px-2 py-1 flex-1" />
        <button (click)="addTask()" class="bg-blue-500 hover:bg-blue-600 text-white px-3 py-1 rounded">
            Add
        </button>
    </div>

    <app-todo-item *ngFor="let task of tasks" [task]="task" (delete)="deleteTask($event)" (edit)="editTask($event)">
    </app-todo-item>
</div>

<div class="flex items-center justify-between bg-gray-100 p-2 mb-2 rounded">


    <!-- When editing -->
    <ng-container *ngIf="editing; else viewMode">
        <input [(ngModel)]="editedTitle" type="text" class="border rounded px-2 py-1 flex-1 mr-2" />
        <button (click)="saveEdit()" class="bg-green-500 hover:bg-green-600 text-white px-2 py-1 rounded mr-1">
            Save
        </button>
        <button (click)="cancelEdit()" class="bg-gray-400 hover:bg-gray-500 text-white px-2 py-1 rounded">
            Cancel
        </button>
    </ng-container>
    <!-- When viewing -->
    <ng-template #viewMode>
        <span>{{ task.title }}</span>
        <div>
            <button (click)="startEdit()" class="bg-yellow-500 hover:bg-yellow-600 text-white px-2 py-1 rounded mr-1">
                Edit
            </button>
            <button (click)="onDelete()" class="bg-red-500 hover:bg-red-600 text-white px-2 py-1 rounded">
                Delete
            </button>
        </div>
    </ng-template>




</div>
